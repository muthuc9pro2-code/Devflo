[project]
name = "devflo"
version = "0.1.0"
description = "Developer incident analysis platform for bounded diagnostic ingestion, deterministic correlation, and LLM-assisted explanation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "ijson>=3.4.0",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "redis>=8.1.0",
    "resend>=2.42.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
